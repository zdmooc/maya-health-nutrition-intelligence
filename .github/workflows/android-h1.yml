name: Android H1 — build and unit tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: SDK platform and build tools
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Kotlin JVM unit tests and debug APK
        working-directory: apps/android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Record checksum and APK metadata
        if: success()
        run: |
          sha256sum apps/android/app/build/outputs/apk/debug/app-debug.apk > apps/android/app/build/outputs/apk/debug/app-debug.apk.sha256
          ls -lh apps/android/app/build/outputs/apk/debug/
      - name: Store debug APK (test only)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: maya-health-android-h1-debug-apk
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/debug/app-debug.apk.sha256
          retention-days: 14
